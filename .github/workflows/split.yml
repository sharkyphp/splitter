# 放在 splitter 仓库的 .github/workflows/split.yml
# 需要：仓库 Secrets MONOREPO_URL、AUTH_MODE(app|pat)
# 需要 secrets：app -> APP_ID + APP_PRIVATE_KEY；pat -> SPLIT_TOKEN
# 联动：monorepo(bytesharky/sharkyphp-v2) 的 .github/workflows/trigger-split.yml
#       在 push 到 main / 打 v* tag 且改动 packages/** 时，会 POST workflow_dispatch 唤醒本工作流
# 本 hourly cron 仅作兜底，实际发版同步由上面的事件驱动触发
name: split

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    # secrets 不能直接用在 if: 里，先挂到 job 级 env 再判断
    env:
      AUTH_MODE: ${{ secrets.AUTH_MODE }}
    steps:
      - name: Checkout splitter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: GitHub App token
        id: app
        if: ${{ env.AUTH_MODE == 'app' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Clone public monorepo (no credentials)
        env:
          MONOREPO_URL: ${{ secrets.MONOREPO_URL }}
        run: |
          set -euo pipefail
          : "${MONOREPO_URL:?请在 splitter 仓库设置 Secrets MONOREPO_URL}"
          git clone --quiet "$MONOREPO_URL" "$RUNNER_TEMP/mono"
          git -C "$RUNNER_TEMP/mono" fetch --quiet --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git -C "$RUNNER_TEMP/mono" config user.name "split bot"
          git -C "$RUNNER_TEMP/mono" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Split and push packages
        env:
          ORG: ${{ github.repository_owner }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PAT: ${{ secrets.SPLIT_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${APP_TOKEN:-$PAT}"
          : "${TOKEN:?缺少凭证：app 模式填 APP_ID/APP_PRIVATE_KEY，pat 模式填 SPLIT_TOKEN}"
          : "${ORG:?无法确定 org 名}"

          MONO="$RUNNER_TEMP/mono"
          cd "$MONO"

          TAGS=$(git tag -l 'v*')
          echo "monorepo tags: ${TAGS:-<none>}"

          for dir in packages/*/; do
            name=$(basename "$dir")
            repo=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
            remote="https://x-access-token:${TOKEN}@github.com/${ORG}/${repo}.git"

            # 只处理已合入 origin/main 的包；本地未提交/拼写错误的目录直接跳过，
            # 避免 'packages/X does not exist' 拖垮整次运行
            if ! git ls-tree -d origin/main -- "packages/$name" >/dev/null 2>&1; then
              echo "skip $name (absent at origin/main)"
              continue
            fi

            # 分支：只认 main
            sha=$(git subtree split --prefix="packages/$name" origin/main 2>/dev/null) \
              || { echo "skip $name (no revisions at main)"; continue; }
            git push --quiet "$remote" "$sha:refs/heads/main" --force

            # tag：Packagist 的版本号完全依赖这一步
            for tag in $TAGS; do
              # 该 package 在对应 tag 中不存在则跳过（新增包后旧 tag 不含此目录）
              git ls-tree -r --name-only "$tag" -- "packages/$name" | grep -q . \
                || { echo "skip $repo@$tag (prefix absent)"; continue; }
              tsha=$(git subtree split --prefix="packages/$name" "$tag" 2>/dev/null) \
                || { echo "skip $repo@$tag (no revisions)"; continue; }
              git push --quiet "$remote" "$tsha:refs/tags/$tag" --force
            done

            echo "pushed $repo ($sha)"
          done

          # 历史变长后可换成（需先下载 splitsh-lite）：
          # sha=$(splitsh-lite --prefix="packages/$name" --origin=origin/main)

      - name: Mirror monorepo + heartbeat
        env:
          ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SELF_TOKEN: ${{ github.token }}
          SPLITTER: ${{ github.workspace }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${SELF_TOKEN}@github.com/${ORG}/${REPO}.git"

          # 公开只读整库镜像（非默认分支，不覆盖 workflow）
          git -C "$RUNNER_TEMP/mono" push --quiet "$remote" \
            "refs/remotes/origin/main:refs/heads/mirror" --force || true

          # 每天一个空转 commit，防止 60 天无活动被 GitHub 停用定时任务
          cd "$SPLITTER"
          today=$(date -u +%F)
          if [ "$(cat LAST_SYNC 2>/dev/null || true)" != "$today" ]; then
            printf '%s\n' "$today" > LAST_SYNC
            git config user.name "split bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LAST_SYNC
            git commit -m "chore: heartbeat $today"
            git push --quiet origin HEAD:main
          fi
